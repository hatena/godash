version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  cooldown:
    default-days: 3
  groups:
    weekly-batch:
      patterns:
        - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  cooldown:
    default-days: 3
  groups:
    weekly-batch:
      patterns:
        - '*'
